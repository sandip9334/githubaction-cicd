<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Actions Demo</title>
  <style>
    body {
      background: #f4f7fb;
      color: #172033;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    main {
      background: white;
      border-radius: 12px;
      margin: 0 auto;
      max-width: 700px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #2563eb;
    }

    .status {
      background: #dcfce7;
      border-radius: 6px;
      color: #166534;
      display: inline-block;
      padding: 10px 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>My third CI/CD Pipeline</h1>
    <p>This website was deployed automatically by GitHub Actions.</p>
    <p class="status">Pipeline successful</p>
  </main>
</body>
</html>
